<body>
  <div id="root">
    <style>
      #global-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8fafc;
        z-index: 9999;
        flex-direction: column;
        gap: 1.5rem;
      }

      .loader-logo {
        width: 120px;
        height: auto;
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .circular-loader {
        width: 40px;
        height: 40px;
        border: 3px solid #f1f5f9;
        border-top-color: #dc2626;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes pulse {

        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: .5;
        }
      }
    </style>
    <div id="global-loader">
      <img src="/pklogo_backup.png" alt="Peakey International" class="loader-logo" />
      <div class="circular-loader"></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
